[project]
name = "weora-cli"
version = "0.1.0"
description = "Weora platform CLI for people and coding agents"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = []

[project.scripts]
weora = "weora_cli.cli:main"

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weora_cli"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
