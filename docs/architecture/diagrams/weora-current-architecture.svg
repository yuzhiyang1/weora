<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"
     aria-labelledby="weora-current-architecture-title weora-current-architecture-desc" id="weora-current-architecture-root">
  <title id="weora-current-architecture-title">Weora 当前架构</title>
  <desc id="weora-current-architecture-desc">控制台和飞书提交任务，PostgreSQL 持久化状态，Celery 调度 Worker 通过执行内核和工具网关运行，Oh My Pi 仍在本地开发。</desc>
  <defs>
      <style>#weora-current-architecture-root { color: #1c1f23; font-family: 'Geist', Aptos, 'Segoe UI Variable', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      #weora-current-architecture-root .diagram-container { overflow-x: auto; }
      #weora-current-architecture-root .diagram-container { overflow-x: visible; }</style>
    <marker id="weora-current-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#646a73"/>
    </marker>
    <marker id="weora-current-architecture-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 Z" fill="#005fd7"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f7f8fa"/>
  <g font-family="'Geist', Aptos, 'Segoe UI Variable', 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#1c1f23">
    <text x="44" y="64" font-size="28" font-family="'Instrument Serif', 'Noto Serif', 'Songti SC', SimSun, serif">Weora 当前架构</text>
    <text x="44" y="96" font-size="14" fill="#646a73">2026-11-06 · 从任务入口、持久化调度到审批约束下的研发执行</text>
    <path d="M 44 120 H 1236" stroke="#d4d7dd"/>

    <!-- API 和 Receiver 独立持久化输入，Beat 从数据库扫描并补投队列。 -->
    <g fill="none" stroke="#646a73" stroke-width="1.2" marker-end="url(#weora-current-architecture-arrow)">
      <path d="M 260 220 H 312"/>
      <path d="M 260 452 H 312"/>
      <path d="M 422 280 V 392"/>
      <path d="M 856 280 V 320 Q 856 328 848 328 H 500 Q 492 328 492 336 V 392"/>
      <path d="M 752 220 H 800" marker-start="url(#weora-current-architecture-arrow)"/>
      <path d="M 1008 220 H 1060"/>
      <path d="M 1148 280 V 328 Q 1148 336 1140 336 H 968 Q 960 336 960 344 V 392"/>
      <path d="M 1008 452 H 1060" stroke="#005fd7" marker-end="url(#weora-current-architecture-arrow-blue)"/>
    </g>

    <g fill="#f7f8fa">
      <rect x="432" y="352" width="54" height="20" rx="2"/>
      <rect x="584" y="300" width="132" height="20" rx="2"/>
      <rect x="984" y="344" width="136" height="20" rx="2"/>
    </g>
    <g fill="#646a73" font-size="12" text-anchor="middle">
      <text x="459" y="366">读写状态</text>
      <text x="650" y="314">扫描待办 / 保存运行</text>
      <text x="1052" y="358">JSONL 工具请求</text>
    </g>

    <g data-node-id="console">
      <rect x="44" y="160" width="216" height="120" rx="6" fill="#ffffff" stroke="#1c1f23"/>
      <text x="60" y="184" font-size="12" fill="#646a73">H · 人工操作</text>
      <text x="60" y="218" font-size="16" font-weight="600">Web 控制台</text>
      <text x="60" y="244" font-size="13" fill="#646a73">创建任务、审批、查看进度</text>
    </g>
    <g data-node-id="feishu">
      <rect x="44" y="392" width="216" height="120" rx="6" fill="#ffffff" stroke="#1c1f23"/>
      <text x="60" y="416" font-size="12" fill="#646a73">P · 渠道接入</text>
      <text x="60" y="450" font-size="16" font-weight="600">飞书 Receiver</text>
      <text x="60" y="476" font-size="13" fill="#646a73">长连接接收，持久化 Inbox</text>
    </g>
    <g data-node-id="api">
      <rect x="312" y="160" width="220" height="120" rx="6" fill="#e8f3ff" stroke="#005fd7" stroke-width="1.4"/>
      <text x="328" y="184" font-size="12" fill="#646a73">P · 控制面</text>
      <text x="328" y="218" font-size="16" font-weight="600">FastAPI</text>
      <text x="328" y="244" font-size="13" fill="#646a73">工作空间、资产、Task / Run</text>
      <text x="328" y="264" font-size="13" fill="#646a73">审批、运行查询与 SSE</text>
    </g>
    <g data-node-id="postgres">
      <rect x="312" y="392" width="220" height="120" rx="6" fill="#eef0f3" stroke="#1c1f23"/>
      <text x="328" y="416" font-size="12" fill="#646a73">P · 权威存储</text>
      <text x="328" y="450" font-size="16" font-weight="600">PostgreSQL</text>
      <text x="328" y="476" font-size="13" fill="#646a73">任务、租约、审批与运行事件</text>
      <text x="328" y="496" font-size="13" fill="#646a73">Inbox / Outbox 与交付回执</text>
    </g>
    <g data-node-id="redis">
      <rect x="576" y="160" width="176" height="120" rx="6" fill="#eef0f3" stroke="#1c1f23"/>
      <text x="592" y="184" font-size="12" fill="#646a73">P · 消息代理</text>
      <text x="592" y="218" font-size="16" font-weight="600">Redis</text>
      <text x="592" y="244" font-size="13" fill="#646a73">队列投递与消费</text>
    </g>
    <g data-node-id="celery">
      <rect x="800" y="160" width="208" height="120" rx="6" fill="#ffffff" stroke="#1c1f23"/>
      <text x="816" y="184" font-size="12" fill="#646a73">P · 调度与执行</text>
      <text x="816" y="218" font-size="16" font-weight="600">Celery Beat / Worker</text>
      <text x="816" y="244" font-size="13" fill="#646a73">补投、主 Agent 协调与执行</text>
      <text x="816" y="264" font-size="13" fill="#646a73">按 Run 快照选择执行内核</text>
    </g>
    <g data-node-id="runtime">
      <rect x="1060" y="160" width="176" height="120" rx="6" fill="#ffffff" stroke="#1c1f23"/>
      <text x="1076" y="184" font-size="12" fill="#646a73">A · 模型与工具循环</text>
      <text x="1076" y="210" font-size="16" font-weight="600">Pi</text>
      <text x="1076" y="230" font-size="13" fill="#646a73">主 Agent 与 Worker</text>
      <rect x="1076" y="244" width="144" height="24" rx="4" fill="#f7f8fa" stroke="#646a73" stroke-dasharray="5 4"/>
      <text x="1084" y="260" font-size="12" fill="#646a73">OMP · 本地 Worker</text>
    </g>
    <g data-node-id="gateway">
      <rect x="800" y="392" width="208" height="120" rx="6" fill="#e8f3ff" stroke="#005fd7" stroke-width="1.4"/>
      <text x="816" y="416" font-size="12" fill="#646a73">P · 权限边界</text>
      <text x="816" y="450" font-size="16" font-weight="600">工具网关</text>
      <text x="816" y="476" font-size="13" fill="#646a73">逐次校验租约、角色和预算</text>
      <text x="816" y="496" font-size="13" fill="#646a73">高风险写入核对审批范围</text>
    </g>
    <g data-node-id="delivery">
      <rect x="1060" y="392" width="176" height="120" rx="6" fill="#ffffff" stroke="#1c1f23"/>
      <text x="1076" y="416" font-size="12" fill="#646a73">T · 受控工具</text>
      <text x="1076" y="450" font-size="16" font-weight="600">上下文与交付</text>
      <text x="1076" y="476" font-size="13" fill="#646a73">飞书 / 仓库读取</text>
      <text x="1076" y="496" font-size="13" fill="#646a73">Docker 沙箱 / 代码评审</text>
    </g>

    <text x="44" y="568" font-size="15" font-weight="600">运行结果留在平台</text>
    <text x="44" y="596" font-size="14" fill="#646a73">控制台读取运行事件与产物，飞书任务由后台通过 Outbox 回报原会话。后续输入可延续同一 Task，并创建新 Run。</text>
    <path d="M 44 632 H 1236" stroke="#d4d7dd"/>
    <g font-size="13" fill="#646a73">
      <text x="44" y="674">H 人工操作</text>
      <text x="164" y="674">P 平台</text>
      <text x="252" y="674">A 执行内核</text>
      <text x="364" y="674">T 工具</text>
      <path d="M 468 669 H 500" stroke="#646a73" stroke-dasharray="5 4"/>
      <text x="512" y="674">本地开发中，尚未合入 main</text>
    </g>
  </g>
</svg>
