[project]
name = "weora-api"
version = "0.1.0"
description = "Weora enterprise Human-Agent collaboration platform API"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "aiohttp>=3.12.0,<4.0.0",
    "alembic>=1.16.0,<2.0.0",
    "alibabacloud-oss-v2>=1.2.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "celery>=5.5.0,<6.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "jsonschema>=4.25.0,<5.0.0",
    "lark-oapi==1.7.5",
    "pwdlib[argon2]>=0.3.0,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "redis>=6.0.0,<7.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "mypy>=1.17.0,<2.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.12.0,<1.0.0",
    "types-pyyaml>=6.0.0,<7.0.0",
    "types-jsonschema>=4.25.0,<5.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weora"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requires explicit external infrastructure configuration",
]

[tool.coverage.run]
branch = true
source = ["weora"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/weora/modules/context/lark_cli_skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["^src/weora/modules/context/lark_cli_skills/"]

[[tool.mypy.overrides]]
# 阿里云 OSS Python SDK V2 1.3.x 尚未发布 py.typed，Adapter 自己定义最小 Protocol 边界。
module = ["alibabacloud_oss_v2", "alibabacloud_oss_v2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery 未提供 py.typed；无类型边界仅限任务入口，应用层保留完整 Protocol 类型。
module = ["celery", "celery.*"]
ignore_missing_imports = true
